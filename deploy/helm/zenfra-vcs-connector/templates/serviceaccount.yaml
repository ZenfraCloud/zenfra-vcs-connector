{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zenfra-vcs-connector.serviceAccountName" . }}
  labels:
    {{- include "zenfra-vcs-connector.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The connector talks to nothing in the cluster API, so it needs no token.
automountServiceAccountToken: false
{{- end }}
