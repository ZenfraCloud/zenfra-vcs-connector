# Values for the Zenfra VCS Connector.
# Required: connector.gatewayUrl, connector.endpoint, secret.name.

replicaCount: 2

image:
  repository: ghcr.io/zenfracloud/zenfra-vcs-connector
  # Defaults to the chart appVersion. Pin a digest or tag for production.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

connector:
  # zenfra-api base URL the connector dials out to.
  gatewayUrl: ""
  # Upstream VCS base URL. Azure DevOps: include the collection.
  endpoint: ""
  # gitlab | github | bitbucket | azure_devops
  vendor: gitlab
  # Pinned origin for GitHub Enterprise archive downloads. Empty = endpoint.
  codeloadEndpoint: ""
  # Project IDs or paths this connector may serve. Required unless allProjects.
  allowedProjects: []
  allProjects: false
  interactiveConnections: 3
  logLevel: info
  # Opt-in modes — see docs/optional-modes.md before changing either.
  # agent_local (default): the credential is the mounted secret file and never
  # leaves this network. control_plane: Zenfra stores it and sends it over the
  # tunnel; no credential is mounted, and the Zenfra integration must be created
  # with the same credential_mode.
  credentialMode: agent_local
  # allowlist (default) | blocklist. Blocklist requires allProjects.
  policyMode: allowlist
  # Directory for the per-instance enrollment key. On its first registration the
  # instance is issued its own key and persists it here; from then on that key —
  # not the fleet-wide bootstrap token — is what it re-registers with, so
  # revoking this instance ends its access for good. Backed by a per-pod
  # emptyDir: it survives container restarts, and a rescheduled pod gets a new
  # name and therefore a new instance record anyway. Set to "" to disable and
  # bootstrap on every restart.
  enrollmentKeyDir: /var/lib/zenfra-vcs-connector

# Bootstrap token and the upstream VCS credential come from a Secret you create
# yourself — the chart never templates secret material, so the credential is not
# in your values file, your git history or `helm get values` output.
#
#   kubectl create secret generic zenfra-vcs-connector \
#     --from-literal=bootstrap-token=vcsc_... \
#     --from-literal=credential=glpat-...
secret:
  name: ""
  bootstrapTokenKey: bootstrap-token
  credentialKey: credential
  # Where the credential file is mounted. The connector reads it per request and
  # never sends it to the control plane.
  mountPath: /etc/zenfra-vcs-connector/secrets

# Trust roots for the two TLS legs, from a ConfigMap you create. Private VCS is
# usually signed by an internal CA the system roots do not carry.
caBundle:
  configMapName: ""
  # Key holding the PEM bundle for the gateway leg (leave empty to use system roots).
  gatewayKey: ""
  # Key holding the PEM bundle for the upstream VCS leg.
  upstreamKey: ""
  mountPath: /etc/zenfra-vcs-connector/ca

# Corporate egress proxy. The connector honours the standard Go proxy variables.
proxy:
  httpProxy: ""
  httpsProxy: ""
  noProxy: ""

metrics:
  enabled: false
  port: 9090
  service:
    enabled: false
    annotations: {}

# Extra environment variables, e.g. further ZENFRA_VCS_CONNECTOR_* overrides.
extraEnv: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
