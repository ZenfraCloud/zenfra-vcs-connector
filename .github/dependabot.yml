# ABOUTME: Dependency updates for the connector module and its workflows.
# ABOUTME: Weekly, grouped, so a customer-audited binary does not drift silently.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
