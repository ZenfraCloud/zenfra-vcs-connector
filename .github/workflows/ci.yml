# ABOUTME: Build, test and lint the connector on every push and pull request.
# ABOUTME: GitHub-hosted runners only — this repository accepts external pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # The packaging tests need both tools; without them they skip, and a broken
      # chart or release config would only surface at tag time.
      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          install-only: true

      - name: Test
        run: go test -race -count=1 ./...

      - name: Fuzz smoke (canonicalizer)
        run: |
          go test -run xxx -fuzz FuzzCanonicalizePath -fuzztime 30s ./internal/policy/
          go test -run xxx -fuzz FuzzCanonicalizeQuery -fuzztime 30s ./internal/policy/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0
          args: --timeout 10m

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # -exclude-generated: tunnel.pb.go is protoc output; its unsafe pointer use
      # is protobuf's, not ours, and cannot carry a #nosec annotation.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
          gosec -exclude-generated ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  image:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build only — publishing happens in the release workflow, on a tag.
      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
